version: '3.8'

services:
  laravel:
    build: ./licne-finansije
    container_name: laravel-app
    volumes:
      - ./licne-finansije:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - app-network
    command: php artisan serve --host=0.0.0.0 --port=8000


  react:
    build: ./licne-finansije-front
    container_name: react-app
    ports:
      - "3000:3000"
    volumes:
      - ./licne-finansije-front:/app
      - /app/node_modules
    networks:
      - app-network


  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finansije
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge

version: '3.8'

services:
  laravel:
    build: ./licne-finansije
    container_name: laravel-app
    volumes:
      - ./licne-finansije:/var/www
    networks:
      - app-network
    command: php-fpm
    expose:
      - "9000"

  nginx:
    build:
      context: ./licne-finansije-front
      dockerfile: Dockerfile
    container_name: nginx-server
    volumes:
      - ./licne-finansije-front/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./licne-finansije:/var/www
    ports:
      - "80:80"
    depends_on:
      - laravel
    networks:
      - app-network
  
  react:
    build:
      context: ./licne-finansije-front
      dockerfile: Dockerfile.dev   # poseban Dockerfile za dev server
    container_name: react-app
    volumes:
      - ./licne-finansije-front:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finansije
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
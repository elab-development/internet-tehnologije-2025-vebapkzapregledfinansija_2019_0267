services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql


  laravel:
    build:
      context: ./licne-finansije
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}


      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./licne-finansije:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel


  front:
    build:
      context: ./licne-finansije-front
      dockerfile: Dockerfile
    environment:
      REACT_APP_API_BASE_URL: ${API_URL}
    depends_on:
      - nginx


volumes:
  dbdata:

